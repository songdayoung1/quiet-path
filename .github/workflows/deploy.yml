name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: quietpath-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
  ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: quietpath
          MYSQL_USER: quietpath
          MYSQL_PASSWORD: quietpath
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Test backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "381492289409"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to EC2 with SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          COMPOSE_B64="$(base64 < deploy/docker-compose.prod.yml | tr -d '\n')"
          CADDYFILE_B64="$(base64 < deploy/Caddyfile | tr -d '\n')"

          DEPLOY_PARAMETERS="$(
            jq -n \
              --arg image_tag "$IMAGE_TAG" \
              --arg aws_region "$AWS_REGION" \
              --arg registry "$ECR_REGISTRY" \
              --arg compose_b64 "$COMPOSE_B64" \
              --arg caddyfile_b64 "$CADDYFILE_B64" \
              '{
                commands: [
                  "set -eu",
                  "cd /opt/quietpath/deploy",
                  "test -f .env",
                  ("printf %s " + ($compose_b64 | @sh) + " | base64 -d > docker-compose.prod.yml"),
                  ("printf %s " + ($caddyfile_b64 | @sh) + " | base64 -d > Caddyfile"),
                  "chown ubuntu:ubuntu docker-compose.prod.yml Caddyfile",
                  "chmod 644 docker-compose.prod.yml Caddyfile",
                  ("export IMAGE_TAG=" + $image_tag),
                  ("aws ecr get-login-password --region " + $aws_region + " | docker login --username AWS --password-stdin " + $registry),
                  "docker compose --env-file .env -f docker-compose.prod.yml config --quiet",
                  "docker compose --env-file .env -f docker-compose.prod.yml pull",
                  "docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans",
                  ("sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=" + $image_tag + "/\" .env"),
                  "chown ubuntu:ubuntu .env",
                  "chmod 600 .env",
                  "docker compose --env-file .env -f docker-compose.prod.yml ps"
                ]
              }'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Deploy quietpath ${IMAGE_TAG}" \
              --parameters "$DEPLOY_PARAMETERS" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command: $COMMAND_ID"

          DEPLOY_STATUS="Pending"

          for attempt in $(seq 1 90); do
            DEPLOY_STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"

            case "$DEPLOY_STATUS" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$DEPLOY_STATUS" != "Success" ]; then
            echo "Deployment failed: $DEPLOY_STATUS"
            exit 1
          fi
