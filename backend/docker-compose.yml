version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: quietpath-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: quietpath
      MYSQL_USER: quietpath
      MYSQL_PASSWORD: quietpath
      MYSQL_ROOT_PASSWORD: root
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci"
    ]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - quietpath-net

  redis:
    image: redis:7.0
    container_name: quietpath-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - quietpath-net

volumes:
  mysql-data:

networks:
  quietpath-net:
