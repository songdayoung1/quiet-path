<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Quiet Path</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mist: {
                50: '#F5F7FA', // Cool white
                100: '#E4E7EB',
                200: '#CBD2D9',
                300: '#9AA5B1',
                400: '#7B8794',
                500: '#616E7C',
                600: '#52606D',
              },
              lavender: {
                50: '#F0F4FF', 
                100: '#DDE6FF',
                200: '#C2D1FF', 
                300: '#A3B8FF',
                400: '#859FFF', 
                500: '#667EEA',
                600: '#5A67D8', 
              },
              point: {
                50: '#F5F3FF',
                100: '#EDE9FE',
                200: '#DDD6FE',
                300: '#C4B5FD',
                400: '#A78BFA',
                500: '#8B5CF6', 
                600: '#7C3AED', 
                700: '#6D28D9',
              },
              mint: {
                100: '#E0F2F1',
                200: '#B2DFDB',
                300: '#80CBC4',
                400: '#4DB6AC',
              },
              surface: {
                white: '#FFFFFF',
                subtle: '#F8FAFC',
              }
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
              serif: ['Georgia', 'Cambria', 'Times New Roman', 'Times', 'serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'slide-up': 'slideUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'float': 'float 8s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'blob': 'blob 25s infinite',
              'sway': 'sway 4s ease-in-out infinite',
              'twinkle': 'twinkle 3s ease-in-out infinite',
              'breathe': 'breathe 6s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              sway: {
                '0%, 100%': { transform: 'rotate(-3deg)' },
                '50%': { transform: 'rotate(3deg)' },
              },
              twinkle: {
                '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0.6', transform: 'scale(0.8)' },
              },
              breathe: {
                '0%, 100%': { transform: 'scale(1)', filter: 'brightness(1)' },
                '50%': { transform: 'scale(1.015)', filter: 'brightness(1.01)' },
              }
            },
            backgroundImage: {
              'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%221%22/%3E%3C/svg%3E')",
            }
          },
        },
      }
    </script>
    <style>
      html, body {
        min-height: 100%;
        width: 100%;
        background: transparent;
        -webkit-tap-highlight-color: transparent;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        min-height: 100%;
      }
      
      /* Film Grain Overlay */
      .film-grain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999; /* Top most layer */
        opacity: 0.03; /* 3% opacity as requested */
        background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');
        mix-blend-mode: overlay;
      }
      
      /* Living Background with Mesh Gradient Effect */
      .living-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
        background: #F8FAFC;
      }
      
      .glass-panel {
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.6) 100%);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 
          inset 0 0 20px rgba(255, 255, 255, 0.6),
          0 8px 32px rgba(31, 38, 135, 0.03);
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      textarea {
        transition: height 0.1s ease;
      }
      /* Time Capsule Blur */
      .capsule-blur {
        color: transparent;
        text-shadow: 0 0 8px rgba(0,0,0,0.15);
        user-select: none;
        filter: blur(4px);
      }

      /* ── Water Drop Micro-interaction ── */
      @keyframes dropFall {
        0%   { transform: translateY(-40px) scale(0.7); opacity: 0; }
        55%  { transform: translateY(6px)  scale(1.12); opacity: 1; }
        75%  { transform: translateY(-3px) scale(0.96); }
        100% { transform: translateY(0)    scale(1);    opacity: 1; }
      }
      @keyframes ripple {
        0%   { transform: scale(0.3); opacity: 0.55; }
        100% { transform: scale(4);   opacity: 0; }
      }
      @keyframes dropletFly {
        0%   { transform: translate(0, 0) scale(1);   opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
      }
      @keyframes successFadeUp {
        0%   { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes overlayIn {
        0%   { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes overlayOut {
        0%   { opacity: 1; }
        100% { opacity: 0; }
      }
      .water-drop-overlay {
        animation: overlayIn 0.25s ease-out forwards;
      }
      .water-drop-overlay.leaving {
        animation: overlayOut 0.35s ease-in forwards;
      }
      .drop-icon {
        animation: dropFall 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      }
      .ripple-ring {
        animation: ripple 0.9s ease-out forwards;
      }
      .droplet {
        animation: dropletFly 0.7s ease-out forwards;
      }
      .success-text {
        animation: successFadeUp 0.45s ease-out 0.5s forwards;
        opacity: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="film-grain"></div>
    <div class="living-bg">
        <!-- Lavender Blob -->
        <div class="absolute top-[-10%] left-[-10%] w-[80vw] h-[80vw] bg-lavender-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>
        <!-- Mint Blob -->
        <div class="absolute top-[10%] right-[-10%] w-[70vw] h-[70vw] bg-mint-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob" style="animation-delay: 4s"></div>
        <!-- White/Subtle Blob -->
        <div class="absolute bottom-[-10%] left-[20%] w-[80vw] h-[80vw] bg-white rounded-full mix-blend-overlay filter blur-3xl opacity-60 animate-blob" style="animation-delay: 8s"></div>
    </div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
